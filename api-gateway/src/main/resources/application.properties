spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=book-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://BOOK-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/books,/api/books/**

spring.cloud.gateway.server.webmvc.routes[1].id=borrowing-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://BORROWING-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/borrow,/api/borrow/**